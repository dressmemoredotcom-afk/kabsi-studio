name: render

# On every push: type check, lint, rule check and a bundle build.
# On demand (Actions tab, Run workflow): render a video and upload it as an artifact.
# Rendered files are never committed; the artifact is where they come from.
on:
  push:
  workflow_dispatch:
    inputs:
      video:
        description: Which video to render
        type: choice
        options: ["roomy", "03", "02", "01"]
        default: "roomy"
      listing:
        description: Roomy listing id (assets/roomy/listings/<id>.json), used when video is roomy
        type: string
        default: "sursock-580sqm"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  render:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages (FFmpeg and Chromium libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-82m-fp32
      - name: Render a Kabsi promo
        if: inputs.video != 'roomy'
        run: node scripts/render.mjs ${{ inputs.video }}
      - name: Render the Roomy listing reel
        if: inputs.video == 'roomy'
        run: npm run render:roomy -- ${{ inputs.listing }}
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.video }}
          path: |
            out/kabsi-promo-${{ inputs.video }}-*
            out/roomy-*.mp4
